[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jp-ebay-finder"
version = "0.1.0"
description = "Find profitable opportunities for selling Japanese domestic products on eBay."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.17,<2",
    "pymysql>=1.1,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "tenacity>=9,<10",
    "rapidfuzz>=3,<4",
    "typer>=0.24,<1",
    "rich>=14,<15",
]

[project.scripts]
finder = "opportunity_finder.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "respx",
    "ruff",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["opportunity_finder*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
